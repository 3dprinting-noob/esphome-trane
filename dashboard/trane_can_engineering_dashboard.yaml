title: Trane CAN Engineering
views:
  - title: Trane CAN
    path: trane-can
    icon: mdi:bus
    badges: []
    cards:
      - type: vertical-stack
        cards:
          - type: custom:mushroom-title-card
            title: Trane CAN Engineering
            subtitle: Passive listen-only (firmware CB2) • no CAN write controls exposed
          - type: thermostat
            entity: climate.trane_thermostat_ux360_trane_climate
            name: Trane (display only – control via Nexia zones)
          - type: history-graph
            title: Compressor and blower (6 h)
            hours_to_show: 6
            entities:
              - entity: sensor.trane_heat_pump_compressor_demand
                name: Compressor demand %
              - entity: sensor.trane_heat_pump_compressor_speed_actual
                name: Compressor speed actual (rps)
              - entity: sensor.trane_air_handler_indoor_blower_speed
                name: Blower %
          - type: history-graph
            title: Power (6 h)
            hours_to_show: 6
            entities:
              - entity: sensor.trane_heat_pump_outdoor_input_power
                name: Outdoor input W
              - entity: sensor.trane_heat_pump_compressor_power
                name: Compressor W
              - entity: sensor.trane_air_handler_blower_power
                name: Blower W
          - type: history-graph
            title: Air temperatures (6 h)
            hours_to_show: 6
            entities:
              - entity: sensor.trane_air_handler_return_air_temp
                name: Return
              - entity: sensor.trane_air_handler_supply_air_temp
                name: Supply
              - entity: sensor.trane_heat_pump_outdoor_air_temp
                name: Outdoor
      - square: false
        type: grid
        columns: 2
        cards:
          - type: vertical-stack
            cards:
