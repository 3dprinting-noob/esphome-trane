# ESPHome Trane — household AtomS3R build, profile CB2 (listen-only recorder)
#
# CB2 (2026-09-28, from the first household capture, docs/house/):
#   - Room Temperature also from 0x490 f0 and Compressor Demand also from
#     0x281 b6 (continuous binary sources; JSON-only left them Unknown after a restart).
#   - Indoor Humidity from 0x490 b4 and from decimal SystemOpStatus.E; "SC360
#     Outdoor Temp" no longer receives E (it was humidity).
#   - Compressor Power in W (this system reports W; CB1's kW filter dropped every value).
#   - New: Operating Mode (0x281 b7), Outdoor Fan Speed Request (0x281 u16@0),
#     Blower Speed Request (0x200 u16@2), Compressor Phase Current (0x388 f0).
#     (Existing "Indoor Coil Temp" = 0x283 f1 is the indoor coil refrigerant temperature.)
#
# ---- CB1 notes ----
#
# Built from installed/esphome-trane.atoms3r.yaml. Changes:
#   - CAN stays mode: LISTENONLY; every transmit path is removed (transmit
#     script, set_temperature/set_mode API actions, climate card actions).
#     The "Trane Climate" card stays as display only (dewbot6 trane_hvac
#     component, pinned to v0.1.0, fetched from GitHub).
#   - Every existing sensor keeps its name, so Home Assistant entity IDs and
#     Climate Brain bindings are unchanged.
#   - Stale-value fixes: Compressor Frequency and Indoor Blower Speed now
#     publish 0; Supply Air Fault clears to "none" once numeric status resumes.
#   - Raw frames logged as TRANE_CAN_LIVE / TRANE_JSON lines for
#     tools/trane_log_collector.py (uncharted9898/esphome-trane, MIT).
#   - Additional candidate sensors from uncharted9898 docs/TELEMETRY.md
#     (a different Trane system; unverified here until the capture is analysed).
#   - OTA and web page passwords (secrets ota_password, web_password).
substitutions:
  version: "cb2-listen-2026.09.28"

esphome:
  name: esphome-trane
  friendly_name: ESPHome Trane
  project:
    name: "andrewsnodgrass.trane-hvac"
    version: ${version}

  on_boot:
    priority: -100
    then:
      - delay: 3s
      - lambda: |-
          // Restore last known mode immediately so climate entity isn't stuck at OFF
          if (!id(last_mode).empty())
            id(system_mode).publish_state(id(last_mode));

  devices:
    - id: dev_thermostat
      name: "Trane Thermostat UX360"
    - id: dev_sc360
      name: "Trane SC360 Controller"
    - id: dev_air_handler
      name: "Trane Air Handler"
    - id: dev_heat_pump
      name: "Trane Heat Pump"

external_components:
  - source:
      type: git
      url: https://github.com/dewbot6/esphome-trane
      ref: v0.1.0
      path: components
    components: [trane_hvac]
    
  - source: github://m5stack/esphome-yaml/components
    components: [lp5562]
    refresh: 0s

i2c:
  - id: bsp_bus
    sda: GPIO45
    scl: GPIO0
    scan: false

spi:
  clk_pin: GPIO15
  mosi_pin: GPIO21

lp5562:
  id: lp5562_led
  i2c_id: bsp_bus
  use_internal_clk: true
  white_current: 17.5

output:
  - platform: lp5562
    id: lp5562_white_channel
    lp5562_id: lp5562_led
    channel: white

light:
  - platform: monochromatic
    name: "LCD Backlight"
    id: lcd_backlight
    output: lp5562_white_channel
    restore_mode: RESTORE_DEFAULT_ON
    
# ============================================================
# ATOMS3R DISPLAY
# ============================================================

font:
  - file: "gfonts://Roboto"
    id: font_small
    size: 13

  - file: "gfonts://Roboto"
    id: font_medium
    size: 16

display:
  - platform: mipi_spi
    id: atoms3r_lcd
    model: ST7735
    dc_pin: GPIO42
    reset_pin: GPIO48
    cs_pin: GPIO14
    data_rate: 20MHz
    update_interval: 1s
    dimensions:
      height: 128
      width: 128
      offset_width: 2
      offset_height: 1
      pad_width: 2
      pad_height: 3
      
    invert_colors: true
    rotation: 180°
    
    lambda: |-
      it.fill(Color(0, 0, 0));

      it.print(
        64, 7,
        id(font_medium),
        Color(255, 255, 255),
        TextAlign::TOP_CENTER,
        "TRANE CAN"
      );

      it.print(
        64, 32,
        id(font_small),
        Color(255, 255, 255),
        TextAlign::TOP_CENTER,
        "LISTEN ONLY CB2"
      );

      it.print(
        64, 53,
        id(font_small),
        Color(255, 255, 255),
        TextAlign::TOP_CENTER,
        "CAN: 50 kbps"
      );

      if (!isnan(id(wifi_signal_db).state)) {
        it.printf(
          64, 74,
          id(font_small),
          Color(255, 255, 255),
          TextAlign::TOP_CENTER,
          "WiFi %.0f dBm",
          id(wifi_signal_db).state
        );
      } else {
        it.print(
          64, 74,
          id(font_small),
          Color(255, 255, 255),
          TextAlign::TOP_CENTER,
          "WiFi: offline"
        );
      }

      if (id(can_rx_count) == 0) {
        it.print(
          64, 94,
          id(font_small),
          Color(255, 255, 255),
          TextAlign::TOP_CENTER,
          "WAITING FOR CAN"
        );

        it.print(
          64, 110,
          id(font_small),
          Color(255, 255, 255),
          TextAlign::TOP_CENTER,
          "RX: 0"
        );
      } else {
        bool can_recent =
          (uint32_t)(millis() - id(last_can_rx_ms)) < 3000;

        it.print(
          64, 94,
          id(font_small),
          Color(255, 255, 255),
          TextAlign::TOP_CENTER,
          can_recent ? "CAN ACTIVE" : "CAN QUIET"
        );

        it.printf(
          64, 110,
          id(font_small),
          Color(255, 255, 255),
          TextAlign::TOP_CENTER,
          "RX: %lu",
          (unsigned long) id(can_rx_count)
        );
      }
esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

logger:
  level: DEBUG
  logs:
    sensor: WARN
    text_sensor: WARN
    canbus: WARN
    trane_wire: INFO
    trane_json: INFO

api:
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

web_server:
  port: 80
  auth:
    username: admin
    password: !secret web_password

improv_serial:

captive_portal:

wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
      hidden: true
  ap:
    ssid: "Trane HVAC Setup"

globals:
  - id: can_rx_count
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: last_can_rx_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
    
  - id: buf_649
    type: std::string
    restore_value: no
    initial_value: ""
  - id: buf_641
    type: std::string
    restore_value: no
    initial_value: ""
  - id: hsp_zone1
    type: float
    restore_value: yes
    initial_value: "70.0"
  - id: csp_zone1
    type: float
    restore_value: yes
    initial_value: "75.0"
  - id: hsp_zone2
    type: float
    restore_value: no
    initial_value: "70.0"
  - id: csp_zone2
    type: float
    restore_value: no
    initial_value: "75.0"
  - id: hsp_zone3
    type: float
    restore_value: no
    initial_value: "70.0"
  - id: csp_zone3
    type: float
    restore_value: no
    initial_value: "75.0"
  - id: hsp_zone4
    type: float
    restore_value: no
    initial_value: "70.0"
  - id: csp_zone4
    type: float
    restore_value: no
    initial_value: "75.0"
  - id: hsp_zone5
    type: float
    restore_value: no
    initial_value: "70.0"
  - id: csp_zone5
    type: float
    restore_value: no
    initial_value: "75.0"
  - id: hsp_zone6
    type: float
    restore_value: no
    initial_value: "70.0"
  - id: csp_zone6
    type: float
    restore_value: no
    initial_value: "75.0"
  - id: preset_home_hsp
    type: float
    restore_value: no
    initial_value: "68.0"
  - id: preset_home_csp
    type: float
    restore_value: no
    initial_value: "72.0"
  - id: preset_away_hsp
    type: float
    restore_value: no
    initial_value: "65.0"
  - id: preset_away_csp
    type: float
    restore_value: no
    initial_value: "82.0"
  - id: preset_sleep_hsp
    type: float
    restore_value: no
    initial_value: "66.0"
  - id: preset_sleep_csp
    type: float
    restore_value: no
    initial_value: "70.0"
  - id: last_mode
    type: std::string
    restore_value: yes
    initial_value: '"off"'

# ---------------------------------------------------------------------------
# Numeric sensors
# ---------------------------------------------------------------------------
sensor:

  # --- Thermostat (UX360) ---------------------------------------------------
  - platform: wifi_signal
    id: wifi_signal_db
    name: "ESPHome Trane WiFi Signal"
    update_interval: 10s
    entity_category: diagnostic

  - platform: template
    name: "Room Temperature"
    id: room_temp
    unit_of_measurement: "°F"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    device_id: dev_thermostat

  - platform: template
    name: "Indoor Humidity"
    id: indoor_humidity
    unit_of_measurement: "%"
    device_class: humidity
    state_class: measurement
    accuracy_decimals: 1
    device_id: dev_thermostat

  - platform: template
    name: "Heat Setpoint Zone 1"
    id: heat_setpoint
    unit_of_measurement: "°F"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 0
    lambda: "return id(hsp_zone1);"
    update_interval: 5s
    device_id: dev_thermostat

  - platform: template
